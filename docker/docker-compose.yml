services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-walletconnect}'
      POSTGRES_USER: '${POSTGRES_USER:-wc_user}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-wc_password}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-wc_user} -d ${POSTGRES_DB:-walletconnect}'
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: 'redis:7.2-alpine'
    command: 'redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    image: 'ghcr.io/gwydeonwow/walletconnect-api:latest'
    environment:
      NODE_ENV: '${NODE_ENV:-production}'
      PORT: '3001'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-wc_user}:${POSTGRES_PASSWORD:-wc_password}@postgres:5432/${POSTGRES_DB:-walletconnect}'
      REDIS_URL: 'redis://redis:6379/0'
      COINGECKO_API_KEY: '${COINGECKO_API_KEY:-}'
      COINGECKO_BASE_URL: '${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}'
      ZERION_API_KEY: '${ZERION_API_KEY:-}'
      ZERION_BASE_URL: '${ZERION_BASE_URL:-https://api.zerion.io/v1}'
      SOLANA_RPC_URL: '${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}'
      SUI_RPC_URL: '${SUI_RPC_URL:-https://fullnode.mainnet.sui.io:443}'
      WEBAUTHN_RP_NAME: '${WEBAUTHN_RP_NAME:-Wallet Connect}'
      WEBAUTHN_RP_ID: '${WEBAUTHN_RP_ID:-localhost}'
      WEBAUTHN_ORIGIN: '${WEBAUTHN_ORIGIN:-http://localhost:3000}'
      SESSION_SECRET: '${SESSION_SECRET:?SESSION_SECRET is required}'
      FRONTEND_URL: '${FRONTEND_URL:-http://localhost:3000}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - '/dev/null'
        - 'http://localhost:3001/health/live'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
  worker:
    image: 'ghcr.io/gwydeonwow/walletconnect-worker:latest'
    environment:
      NODE_ENV: '${NODE_ENV:-production}'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-wc_user}:${POSTGRES_PASSWORD:-wc_password}@postgres:5432/${POSTGRES_DB:-walletconnect}'
      REDIS_URL: 'redis://redis:6379/0'
      COINGECKO_API_KEY: '${COINGECKO_API_KEY:-}'
      COINGECKO_BASE_URL: '${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}'
      ZERION_API_KEY: '${ZERION_API_KEY:-}'
      ZERION_BASE_URL: '${ZERION_BASE_URL:-https://api.zerion.io/v1}'
      SOLANA_RPC_URL: '${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}'
      SUI_RPC_URL: '${SUI_RPC_URL:-https://fullnode.mainnet.sui.io:443}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: 'ghcr.io/gwydeonwow/walletconnect-web:latest'
    environment:
      NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-http://api:3001}'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - '/dev/null'
        - 'http://127.0.0.1:3000/'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres_data: null
